<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aqarati_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>aqarati_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- No Google Maps JS API script tag needed: web renders a real map via a
       keyless iframe embed (lib/core/widgets/aqarati_map_view_web.dart),
       not the JS Maps SDK. See AQARATI_GOOGLE_MAPS_IMPLEMENTATION.md. -->

  <style>
    #boot-diagnostics {
      display: none;
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      max-height: 40vh;
      z-index: 999999;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #b00020;
      border-radius: 8px;
      color: #b00020;
      font: 12px/1.5 monospace;
      padding: 10px 12px;
      overflow: auto;
      white-space: pre-wrap;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }
    #boot-diagnostics summary {
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <details id="boot-diagnostics">
    <summary>Startup diagnostics (tap to expand)</summary>
    <div id="boot-diagnostics-body"></div>
  </details>
  <script>
    (function () {
      var panel = document.getElementById('boot-diagnostics');
      var body = document.getElementById('boot-diagnostics-body');
      var lines = [];
      function show(text) {
        lines.push(text);
        body.textContent = lines.join('\n\n');
        panel.style.display = 'block';
      }
      function hasCanvas(root) {
        var found = false;
        root.querySelectorAll('*').forEach(function (el) {
          if (found) return;
          if (el.tagName && el.tagName.toLowerCase() === 'canvas') { found = true; return; }
          if (el.shadowRoot && hasCanvas(el.shadowRoot)) found = true;
        });
        return found;
      }
      window.addEventListener('error', function (e) {
        show('window error: ' + (e.message || e.error) + (e.filename ? '\nat ' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('unhandled rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
      });
      var canvas = document.createElement('canvas');
      var gl2 = canvas.getContext('webgl2');
      var gl1 = !gl2 && canvas.getContext('webgl');
      if (!gl2 && !gl1) {
        show(
          'WebGL is not available in this browser/device, so the app cannot render.\n' +
          'User agent: ' + navigator.userAgent
        );
      }
      setTimeout(function () {
        if (!hasCanvas(document) && lines.length === 0) {
          show(
            'Flutter never attached a canvas after 8s (silent stall).\n' +
            'User agent: ' + navigator.userAgent
          );
        }
      }, 8000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
